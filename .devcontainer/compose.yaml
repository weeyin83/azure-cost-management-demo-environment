services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["sleep", "infinity"]
    working_dir: /workspaces/contoso-finops
    env_file: .env
    depends_on:
      sql:
        condition: service_healthy
    volumes:
      - ..:/workspaces/contoso-finops:cached
      - nuget:/home/vscode/.nuget/packages
      - bicep:/home/vscode/.bicep
      - app-bin:/workspaces/contoso-finops/src/ContosoFinOps/bin
      - app-obj:/workspaces/contoso-finops/src/ContosoFinOps/obj
      - test-bin:/workspaces/contoso-finops/tests/ContosoFinOps.Tests/bin
      - test-obj:/workspaces/contoso-finops/tests/ContosoFinOps.Tests/obj
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file: .env
    environment:
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 3g
    volumes:
      - sql-data:/var/opt/mssql
      - ../scripts/sql:/seed:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  nuget:
  bicep:
  app-bin:
  app-obj:
  test-bin:
  test-obj:
  sql-data:
