name: .NET tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools
        run: dotnet tool restore
      - name: Restore packages
        run: dotnet restore ContosoFinOps.slnx
      - name: Build
        run: dotnet build ContosoFinOps.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test ContosoFinOps.slnx --no-build --configuration Release
      - name: Test local credential initialization
        run: bash .devcontainer/tests/initialize-env.tests.sh
